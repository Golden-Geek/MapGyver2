name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  plan:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: python3 tools/validate_plan.py
  windows-native:
    name: windows-native (${{ matrix.configuration }})
    runs-on: windows-2022
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        configuration: [Debug, Release]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build and test native Windows contracts
        run: python tools/ci/check.py --preset windows-ci --configuration ${{ matrix.configuration }}
      - name: Retain source, environment, command and test evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-${{ matrix.configuration }}-${{ github.sha }}
          path: |
            out/reports/
            out/build/windows-ci/Testing/
            out/build/windows-ci/CMakeCache.txt
            out/build/windows-ci/CMakeFiles/CMakeConfigureLog.yaml
          if-no-files-found: error
          retention-days: 14
  portable-core:
    name: portable-core (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build and test native portable core
        run: python3 tools/ci/check.py --preset portable-ci --configuration Release
      - name: Retain source, environment, command and test evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: portable-${{ matrix.os }}-${{ github.sha }}
          path: |
            out/reports/
            out/build/portable-ci/Testing/
            out/build/portable-ci/CMakeCache.txt
            out/build/portable-ci/CMakeFiles/CMakeConfigureLog.yaml
          if-no-files-found: error
          retention-days: 14
  quality-gate:
    if: always()
    needs: [plan, windows-native, portable-core]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      PLAN_RESULT: ${{ needs.plan.result }}
      WINDOWS_RESULT: ${{ needs['windows-native'].result }}
      PORTABLE_RESULT: ${{ needs['portable-core'].result }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: python3 tools/ci/quality_gate.py
